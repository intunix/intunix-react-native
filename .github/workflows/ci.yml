name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
env:
  RN_VERSION: 0.79.5
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx jest

  # Fresh React Native apps that install this package from a tarball, the way users do.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: pkg }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Create the app
        run: |
          cd pkg && npm pack && cd ..
          npx @react-native-community/cli@latest init Consumer --version "$RN_VERSION" --skip-git-init --install-pods false
          cd Consumer && npm install ../pkg/intunix-react-native-*.tgz --no-audit --no-fund
      - name: Build Android
        working-directory: Consumer/android
        run: |
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a > "$RUNNER_TEMP/a.log" 2>&1 || {
            grep -E -A4 "^e: |error:|What went wrong" "$RUNNER_TEMP/a.log" | head -n 40 | while read -r l; do [ -n "$l" ] && echo "::error::$l"; done
            exit 1
          }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { path: pkg }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Create the app
        run: |
          cd pkg && npm pack && cd ..
          npx @react-native-community/cli@latest init Consumer --version "$RN_VERSION" --skip-git-init --install-pods false
          cd Consumer && npm install ../pkg/intunix-react-native-*.tgz --no-audit --no-fund
          cd ios && bundle install && bundle exec pod install
      - name: Build iOS
        working-directory: Consumer/ios
        run: |
          xcodebuild -workspace Consumer.xcworkspace -scheme Consumer -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/i.log" 2>&1 || {
            grep -E -B2 -A3 "Undefined symbol|ld: |error:" "$RUNNER_TEMP/i.log" | grep -vE "warning:|note:" | head -n 45 | while read -r l; do [ -n "$l" ] && echo "::error::$l"; done
            exit 1
          }
