buildscript {
    ext.safeExtGet = { prop, fallback -> rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '1.9.24')}"
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// The native SDK is published on JitPack; make it resolvable for the app too.
rootProject.allprojects {
    repositories { maven { url "https://jitpack.io" } }
}

android {
    namespace "com.intunix.reactnative"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)
    defaultConfig {
        minSdkVersion Math.max(24, safeExtGet("minSdkVersion", 24))
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "com.github.intunix:intunix-android:1.6.0"
}
